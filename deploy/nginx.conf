worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 8080;
    absolute_redirect off;  # relative Location: the pod sits behind istio + nginx on :443
    root /usr/share/nginx/html;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /fonts/  { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location /img/    { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # Old platform (Polymer centraldashboard) page URLs -> the same React pages, so bookmarks and
    # links in sent emails keep working after the platform.isigpu.local cutover.
    location ~ ^/_/(jupyter|notebooks)/?$ { return 302 /#/notebooks; }
    location ~ ^/_/(volumes|pvc-browser)/?$ { return 302 /#/volumes; }
    location ~ ^/_/(vms|mail|help)/?$ { return 302 /#/$1; }
    location ~ ^/(admin-panel|manage-users)/?$ { return 302 /#/$1; }
    location / { try_files $uri =404; }
  }
}
